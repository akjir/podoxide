[package]
name = "podoxide"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
name = "podoxide"
path = "src/lib.rs"

[[bin]]
name = "pods"
path = "src/main.rs"

[dependencies]

[dev-dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
